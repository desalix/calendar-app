name: Atlas
options:
  bundleIdPrefix: com.desalix
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  Atlas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desalix.Atlas
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"

  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AtlasUITests
    settings:
      base:
        TEST_TARGET_NAME: Atlas
        PRODUCT_BUNDLE_IDENTIFIER: com.desalix.AtlasUITests
    dependencies:
      - target: Atlas

schemes:
  Atlas:
    build:
      targets:
        Atlas: [run, test, profile, analyze, archive]
        AtlasUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AtlasUITests
          parallelizable: false
          randomExecutionOrder: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
